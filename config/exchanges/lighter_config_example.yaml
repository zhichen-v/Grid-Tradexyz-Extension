# Lighter exchange config example.
# Copy to config/exchanges/lighter_config.yaml (gitignored) and fill in your values.
#
# Create the API key in the Lighter app, save its private key, and note the
# account index and API key index it was registered under.

lighter:
  network: "robinhood"        # robinhood | robinhood_testnet | mainnet | testnet
  # market_order_slippage: "0.01"   # optional protective bound for taker closes
  authentication:
    api_key_private_key: ""   # never commit
    account_index: 0
    api_key_index: 0
    expected_l1_address: ""   # optional: preflight checks the key belongs to this wallet
