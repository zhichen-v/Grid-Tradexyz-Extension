# Lighter BTC Market Maker MVP 範例設定。
# 身分驗證沿用既有 wallet profile；本檔不得存放任何憑證。
# 僅供欄位說明與安全 dry-run 起點，不可直接作為 live 候選。
market_maker:
  exchange: "lighter"
  symbol: "BTC"

  # 金融數值以字串保存，避免 YAML 先轉成浮點數。
  order_size: "0.00020"
  # Step B 使用 bid_only 或 ask_only；Step C 使用 both。
  quote_mode: "both"
  # 成交後只保留反向 reduce-only 報價，authenticated flat 後才恢復雙邊。
  ping_pong_enabled: false

  # 單邊距離；完整 Bid-Ask spread 約為兩倍此值。
  base_half_spread_ticks: 1
  max_inventory_skew_ticks: 4
  reprice_threshold_ticks: 1
  # External BBO 過寬時 midpoint 不可信，停止報價並撤單。
  max_raw_spread_bps: "100"
  # 兩者同為0時停用；啟用後只擋逆勢、風險增加的入場側。
  trend_guard_window_seconds: 0
  trend_guard_threshold_ticks: 0

  # Live 前依實際帳戶 tier 核對 maker fee；不可假設永遠為零。
  maker_fee_rate: "0"
  # 只有下方 active_unwind_enabled 明確啟用時才使用；仍需逐次核對 tier。
  taker_fee_rate: "0"
  min_profit_buffer_bps: "0.5"

  max_position: "0.00200"
  soft_position_ratio: "0.50"
  hard_position_ratio: "0.80"

  refresh_interval_ms: 1000
  min_order_lifetime_ms: 1000

  stale_book_seconds: 3
  stale_position_seconds: 10
  position_poll_interval_seconds: 3
  order_sync_interval_seconds: 10
  health_check_interval_seconds: 60

  # 0 表示停用；live 必須啟用 in-process authenticated account audit。
  account_audit_interval_seconds: 0
  # 主網 authenticated snapshot 由多個連續讀取組成；15s 仍為 bounded hard stop。
  account_audit_timeout_seconds: 15
  max_session_drawdown: "0"
  # 絕對 session loss 上限；只供已鎖定的 POST_ONLY reduce-only exit 使用。
  # 0 表示停用；啟用值必須低於 max_session_drawdown。
  max_session_loss_for_maker_exit: "0"
  # 達 completed fill 門檻即驗 fee/net；完整 equity GO 另待自然 flat。
  economic_min_fills: 8
  # (completed gross - exact fee) / two-leg turnover，單位為 bps。
  min_completed_net_turnover_bps: "0"
  # Optional timed relaxation for reduce-only inventory exits. Disabled by
  # default. When enabled, the static soft target is only reachable when
  # authenticated completed-session surplus can fund it，或由上方明確的
  # session-loss budget 支付；最終 session economic GO 門檻不會降低。
  soft_exit_after_seconds: 0
  soft_exit_net_turnover_bps: "0"
  soft_exit_surplus_reserve_bps: "0.02"
  # Per-inventory-episode triple barrier，預設完全停用。一般 entry／exit
  # 仍維持 POST_ONLY；只有 barrier 觸發後的隔離 lane 可送 bounded
  # LIMIT+IOC+reduce_only，且必須先撤 managed orders、刷新 BBO／position／audit。
  active_unwind_enabled: false
  active_unwind_after_seconds: 0
  active_unwind_loss_trigger: "0"
  active_unwind_max_slippage_ticks: 0
  active_unwind_max_attempts: 1
  active_unwind_confirmation_timeout_seconds: 5
  # Episode 與 maker+taker session 的絕對 loss cap；啟用時皆須為正，
  # session cap 必須低於 max_session_drawdown，且 maker exit budget 亦須為正。
  max_episode_loss_for_unwind: "0"
  max_session_loss_for_unwind: "0"
  require_flat_start: false

  max_consecutive_errors: 5
  error_cooldown_seconds: 5
  max_mutations_per_minute: 30

  post_only: true
  exclusive_symbol_control: true
  startup_open_order_policy: "abort"
  unknown_order_policy: "pause"
  cancel_on_shutdown: true

  # 安全預設；live 必須由操作者明確改為 false。
  dry_run: true
  log_status_interval_seconds: 10
